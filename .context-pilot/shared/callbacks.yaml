rust-lints:
  name: rust-lints
  description: Rust-lints family (fmt, clippy -D warnings, cargo check, lint-exception registry, vault-bypass)
  pattern: '**/*.rs'
  blocking: true
  timeout_secs: 120
  success_message: Rust lints OK ✓
  is_global: true
  concurrency_friendly: false
  script_content: bash "$CP_PROJECT_ROOT/.github/checks/check-rust-lints.sh" --callback
structure-rust:
  name: structure-rust
  description: Structure family (file lengths ≤500, dir entries ≤8, hash chain) on Rust edits
  pattern: '**/*.rs'
  blocking: true
  timeout_secs: 30
  success_message: Structure OK ✓
  is_global: true
  concurrency_friendly: false
  script_content: bash "$CP_PROJECT_ROOT/.github/checks/check-structure.sh" --callback
