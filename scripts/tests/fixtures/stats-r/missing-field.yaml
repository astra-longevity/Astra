case: missing-field
reference: verification/references/coloc/
reference_kind: hand-computed
description: Known-bad fixture for scripts/tests/stats-r.test.sh. No `expected` field, so the runner must fail before running anything.

package:
  name: coloc
  version: 5.2.3
  source: CRAN

inputs:
  file: verification/references/coloc/inputs.csv

call: |
  res <- list(summary = c(PP.H4.abf = 1))

outputs:
  'res$summary["PP.H4.abf"]': PP.H4

tolerance:
  PP: 1e-9
