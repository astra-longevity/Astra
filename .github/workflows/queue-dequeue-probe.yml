# TEMPORARY probe (A61, queue watchdog): can GITHUB_TOKEN call dequeuePullRequest?
# Calls it on this PR itself, which is a draft and never in the queue.
# Removed before the watchdog PR leaves draft.
name: Dequeue probe (temporary)

on:
  pull_request:
    paths:
      - .github/workflows/queue-dequeue-probe.yml

permissions:
  contents: read
  pull-requests: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call dequeuePullRequest on this PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_ID: ${{ github.event.pull_request.node_id }}
        run: |
          set +e
          out=$(gh api graphql -f query='mutation($id: ID!) { dequeuePullRequest(input: {id: $id}) { mergeQueueEntry { id } } }' -f id="$PR_ID" 2>&1)
          echo "exit=$?"
          echo "$out"
          {
            echo '### dequeue probe'
            echo '```'
            echo "$out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
