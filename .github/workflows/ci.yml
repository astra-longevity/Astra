name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.97.1"

permissions:
  contents: read

# ── Check families, one script each (.github/checks/check-<family>.sh),
#    every one invoked here with --ci and by its blocking callback with
#    --callback. CI and the callbacks run the SAME script — they cannot diverge
#    in coverage; the flag exists only for a future CI-vs-local environment
#    tweak (today only rust-tests differs: --ci release build, --callback debug).
#    Jobs stay split for parallelism + shared toolchain/node setup; each job
#    just runs its family script(s).
jobs:
  rust:
    name: Rust (lints · tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust ${{ env.RUST_VERSION }}
        run: |
          rustup toolchain install ${{ env.RUST_VERSION }} --profile minimal --component rustfmt,clippy
          rustup default ${{ env.RUST_VERSION }}

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      # fmt · clippy · cargo check · lint-exception registry · vault-bypass
      - name: Rust lints
        run: .github/checks/check-rust-lints.sh --ci

      # cargo build --release · cargo test
      - name: Rust tests
        run: .github/checks/check-rust-tests.sh --ci

  structure:
    name: Structure (lengths · folders · chain)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # file-lengths ≤500 + folder-sizes ≤8 (Rust tree) + hash chain
      - name: Structure
        run: .github/checks/check-structure.sh --ci

  # D47 write paths for verification/ + D69 decision citations.
  # Convention, not proof: self-declared `Agent:` trailers, shared token (D68 refused).
  write-paths:
    name: Write paths (D47 · D69)
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Self-tests
        run: scripts/tests/check-write-paths.test.sh

      - name: Check write paths
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
          MQ_BASE: ${{ github.event.merge_group.base_sha }}
          MQ_HEAD: ${{ github.event.merge_group.head_sha }}
        run: |
          if [ "$EVENT" = "merge_group" ]; then
            base="$MQ_BASE"; head="$MQ_HEAD"
            # The squash message carries the PR body and the commits' trailers.
            git log --format=%B "$base..$head" >"$RUNNER_TEMP/body.md"
          else
            base="$PR_BASE"; head="$PR_HEAD"
            printf '%s\n' "$PR_BODY" >"$RUNNER_TEMP/body.md"
          fi
          scripts/check-write-paths.sh --base "$base" --head "$head" --body-file "$RUNNER_TEMP/body.md"

