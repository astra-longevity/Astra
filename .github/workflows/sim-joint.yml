name: Sim joint (R-Sim v0)

# R-Sim v0 sharded studies (research/sim/v0/actions-job.md).
#   study=joint     -> py/studies/shard.py           (joint survival + readout Fisher, 218 shards per n_sim)
#   study=challenge -> py/studies/shard_challenge.py (eta/beta cost grid, 462 shards per n_sim)
# Both scripts share the CLI --list | --shard <spec> --n-sim N --out DIR | --gather DIR --n-sim N.
# Manual dispatch only (A10). Synthetic data only (L0): the checkout holds
# research/sim/v0/py/ and nothing else, so no job can read data/ or a lifespan
# table. Python 3.13 standard library, no network after setup. Never writes to
# the repository: shards, result.json and run-info.json are artifacts.
#
# The (n_sim, spec) jobs are split into two matrices of at most 256 each
# (GitHub's matrix cap), run one after the other, at most 20 runners at a time.

on:
  workflow_dispatch:
    inputs:
      study:
        description: "joint (shard.py) or challenge (shard_challenge.py)"
        type: choice
        options: [joint, challenge]
        default: joint
      seeds:
        description: "Derivative seeds (must equal shard.py SEEDS)"
        type: string
        default: "11,12"
      n_sim:
        description: "Comma-separated n_sim values, at most 2 (challenge: 1)"
        type: string
        default: "20000,50000"

permissions:
  contents: read

env:
  PY_DIR: research/sim/v0/py
  PYTHON_VERSION: "3.13"

jobs:
  plan:
    name: Plan shards (${{ inputs.study }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      script: ${{ steps.plan.outputs.script }}
      ns: ${{ steps.plan.outputs.ns }}
      chunk_a: ${{ steps.plan.outputs.chunk_a }}
      chunk_b: ${{ steps.plan.outputs.chunk_b }}
      has_b: ${{ steps.plan.outputs.has_b }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: research/sim/v0/py
          sparse-checkout-cone-mode: true

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build matrices
        id: plan
        working-directory: ${{ env.PY_DIR }}/studies
        env:
          STUDY_IN: ${{ inputs.study }}
          SEEDS_IN: ${{ inputs.seeds }}
          N_SIM_IN: ${{ inputs.n_sim }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re, subprocess, shard
          script = {"joint": "shard.py", "challenge": "shard_challenge.py"}.get(os.environ["STUDY_IN"])
          if script is None:
              raise SystemExit(f"study {os.environ['STUDY_IN']!r}: joint or challenge")
          seeds = tuple(int(s) for s in os.environ["SEEDS_IN"].split(","))
          if seeds != tuple(shard.SEEDS):
              raise SystemExit(f"seeds {seeds} != shard.py SEEDS {shard.SEEDS}: change shard.py by PR")
          raw = os.environ["N_SIM_IN"].replace(" ", "")
          if not re.fullmatch(r"\d+(,\d+)?", raw):
              raise SystemExit(f"n_sim {raw!r}: one or two integers, comma-separated")
          ns = [int(n) for n in raw.split(",")]
          specs = subprocess.run(["python3", script, "--list"], check=True,
                                 capture_output=True, text=True).stdout.split()
          jobs = [{"n": n, "i": i, "spec": s} for n in ns for i, s in enumerate(specs)]
          cap = 256
          if len(jobs) > 2 * cap:
              raise SystemExit(f"{len(jobs)} shards > {2 * cap}: dispatch one n_sim at a time")
          print(f"script={script}")
          print("ns=" + json.dumps(ns))
          print("chunk_a=" + json.dumps(jobs[:cap]))
          print("chunk_b=" + json.dumps(jobs[cap:] or [{"n": 0, "i": 0, "spec": ""}]))
          print(f"has_b={'true' if len(jobs) > cap else 'false'}")
          PY
          echo "study ${STUDY_IN}: $(grep -c . <<<"$(python3 "$(sed -n 's/^script=//p' "$GITHUB_OUTPUT")" --list)") shards per n_sim" >> "$GITHUB_STEP_SUMMARY"

  shard-a:
    name: Shard n_sim=${{ matrix.s.n }} (${{ matrix.s.i }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: true
      max-parallel: 20
      matrix:
        s: ${{ fromJSON(needs.plan.outputs.chunk_a) }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: research/sim/v0/py
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Run shard (one retry)
        working-directory: ${{ env.PY_DIR }}/studies
        env:
          SCRIPT: ${{ needs.plan.outputs.script }}
          SPEC: ${{ matrix.s.spec }}
          N_SIM: ${{ matrix.s.n }}
        run: |
          python3 "$SCRIPT" --shard "$SPEC" --n-sim "$N_SIM" --out "$RUNNER_TEMP/shards" \
            || python3 "$SCRIPT" --shard "$SPEC" --n-sim "$N_SIM" --out "$RUNNER_TEMP/shards"
      - uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.s.n }}-${{ matrix.s.i }}
          path: ${{ runner.temp }}/shards/*.json
          if-no-files-found: error
          retention-days: 7

  shard-b:
    name: Shard n_sim=${{ matrix.s.n }} (${{ matrix.s.i }})
    needs: [plan, shard-a]
    if: needs.plan.outputs.has_b == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: true
      max-parallel: 20
      matrix:
        s: ${{ fromJSON(needs.plan.outputs.chunk_b) }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: research/sim/v0/py
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Run shard (one retry)
        working-directory: ${{ env.PY_DIR }}/studies
        env:
          SCRIPT: ${{ needs.plan.outputs.script }}
          SPEC: ${{ matrix.s.spec }}
          N_SIM: ${{ matrix.s.n }}
        run: |
          python3 "$SCRIPT" --shard "$SPEC" --n-sim "$N_SIM" --out "$RUNNER_TEMP/shards" \
            || python3 "$SCRIPT" --shard "$SPEC" --n-sim "$N_SIM" --out "$RUNNER_TEMP/shards"
      - uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.s.n }}-${{ matrix.s.i }}
          path: ${{ runner.temp }}/shards/*.json
          if-no-files-found: error
          retention-days: 7

  gather:
    name: Gather n_sim=${{ matrix.n }}
    needs: [plan, shard-a, shard-b]
    if: ${{ !cancelled() && needs.shard-a.result == 'success' && needs.shard-b.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        n: ${{ fromJSON(needs.plan.outputs.ns) }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: research/sim/v0/py
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          pattern: shard-${{ matrix.n }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/shards
      - name: Gather and analyse
        working-directory: ${{ env.PY_DIR }}/studies
        env:
          SCRIPT: ${{ needs.plan.outputs.script }}
          STUDY: ${{ inputs.study }}
          N_SIM: ${{ matrix.n }}
          OUT: ${{ runner.temp }}/out
        run: |
          mkdir -p "$OUT"
          count=$(find "$RUNNER_TEMP/shards" -name '*.json' | wc -l)
          echo "shards: $count"
          test "$count" -eq "$(python3 "$SCRIPT" --list | wc -l)"
          cp -r "$RUNNER_TEMP/shards" "$OUT/shards"
          python3 "$SCRIPT" --gather "$RUNNER_TEMP/shards" --n-sim "$N_SIM" > "$OUT/result.json"
          python3 - <<'PY' > "$OUT/run-info.json"
          import hashlib, json, os, platform
          print(json.dumps({
              "code_commit": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "study": os.environ["STUDY"],
              "script": os.environ["SCRIPT"],
              "n_sim": int(os.environ["N_SIM"]),
              "python": platform.python_version(),
              "result_sha256": hashlib.sha256(open(os.path.join(os.environ["OUT"], "result.json"), "rb").read()).hexdigest(),
          }, indent=1, sort_keys=True))
          PY
          {
            echo "### ${STUDY}, n_sim ${N_SIM}"
            echo '```json'
            cat "$OUT/run-info.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: sim-${{ inputs.study }}-${{ matrix.n }}
          path: ${{ runner.temp }}/out
          if-no-files-found: error
          retention-days: 30
