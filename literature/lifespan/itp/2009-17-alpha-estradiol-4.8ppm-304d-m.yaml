notes: >
  Median +12% pooled (table 1 p = 0.002; text p = 0.0012), driven by UT (+28%, p = 0.0008); TJL and UM +3% (ns). No significant p90 effect. Excluding deaths before 600 d: +5% (table S2). Authors call the evidence equivocal (one site). Site heterogeneity (T1-A2-3): significant at 1 of 3 sites only (UT +28%; TJL, UM +3%, ns); UT male controls were the shortest-lived (median 704 d vs 807/925). Treat as not replicated across sites; candidate replication = C2011 17-alpha-estradiol 14.4 ppm from 10 mo (Strong 2016; different dose). UM male control p90 is printed as 1051 in the ACA block and 1151 in the EST/MB blocks (same controls). All mice dead at analysis; 3-5% removed (about 20% of TJL
  female controls). Controls shared by ACA, EST and MB in C2009.
