# Class labels per compound (T2-A2-4, Verification ruling C4-C6).
# Hashed by the test-2 split seal (D115). approved_by / approved_date are set by
# Verification only. A label source must report no lifespan outcome
# (pharmacology paper, or a ChEMBL / DrugBank / IUPHAR entry with snapshot date).
#
# Rules:
# - class = primary molecular target, from the vocabulary below (closed list).
# - Primary target = the target the source names as the main mechanism.
#   If the source names two or more targets without ranking them: multi-target.
#   Mixtures and extracts without a single defined active compound: no defined target.
# - Vocabulary entries may be added only before the split is sealed, with
#   Verification approval. No new class after the seal.
#
# Sources for the R-Metric v0 split (research/metric/v0/split.csv), A28 task, 2026-10-20:
# - ChEMBL REST API, mechanism endpoint only (no activity or outcome data read),
#   https://www.ebi.ac.uk/chembl/api/data/mechanism.json?molecule_chembl_id=<id>.
#   The mechanism may sit on a salt form; `chembl_id` is the form that carries it.
# - IUPHAR/BPS Guide to Pharmacology: web services and ligand pages are login-only
#   since 2026-10-20 (HTTP 401 "API key is missing"; pages redirect to login.jsp).
#   Not used for new entries; access requested via A2.
# - `labels`: ChEMBL mechanism matches the class proposed in split.csv.
# - `conflicts`: ChEMBL mechanism differs from the proposed class. No class chosen
#   here: A28 decides the class, Verification approves the mapping.
# - `missing`: no usable ChEMBL/IUPHAR mechanism entry. No other source substituted.
#   reason: unusable (entry exists, mechanism not a target) | no_mechanism (molecule in
#   ChEMBL, no mechanism record) | not_in_chembl (no molecule by exact name/synonym).
vocabulary:
  - ACE inhibitor
  - DPP-4 inhibitor
  - HCN channel blocker
  - MAO-B inhibitor
  - MEK inhibitor
  - mTORC1 inhibitor
  - multi-target
  - no defined target
  - PDE5 inhibitor
  - PDK inhibitor
  - PI3K-alpha inhibitor
  - SGLT2 inhibitor
