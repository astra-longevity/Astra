conflicts:
  - compound: rapamycin
    proposed: mTORC1 inhibitor
    chembl: CHEMBL413, FK506-binding protein 1A inhibitor (target CHEMBL1902)
    note: current label cites IUPHAR 6031 (mTOR via FKBP12 complex), login-only since 2026-10-20
  - compound: cinnarizine
    proposed: calcium channel blocker
    chembl: >
      CHEMBL43064, Voltage-gated L-type calcium channel blocker (CHEMBL2095229) and
      Histamine H1 receptor antagonist (CHEMBL231), unranked
    note: two unranked targets; the rule would give multi-target
  - compound: metformin
    proposed: biguanide
    chembl: >
      CHEMBL1703 (metformin hydrochloride), Mitochondrial complex I (NADH dehydrogenase)
      inhibitor (CHEMBL2363065) and Mitochondrial glycerol-3-phosphate dehydrogenase
      inhibitor (CHEMBL3391681), unranked
    note: biguanide is a chemical class, not a target; two unranked targets would give multi-target
  - compound: nordihydroguaiaretic acid
    proposed: lipoxygenase inhibitor
    chembl: >
      CHEMBL313972 (masoprocol), Unknown; Receptor protein-tyrosine kinase erbB-2
      inhibitor (CHEMBL1824); Insulin-like growth factor I receptor inhibitor (CHEMBL1957)
    note: no lipoxygenase mechanism in ChEMBL
  - compound: chloroquine
    proposed: lysosomal autophagy inhibitor
    chembl: >
      CHEMBL76 forms CHEMBL58510 / CHEMBL4297165, Ferriprotoporphyrin IX inhibitor /
      binding agent (target CHEMBL613897)
    note: antimalarial mechanism; no lysosomal/autophagy mechanism in ChEMBL
