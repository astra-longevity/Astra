id: dido-diversity-outbred-dr
title: "JAX Diversity Outbred dietary restriction lifespan study (DRiDO)"
description: >-
  960 female Diversity Outbred mice on five diets (ad libitum, two
  intermittent fasting, two caloric restriction levels), phenotyped repeatedly
  and followed to death. Genetically diverse longitudinal data for metric v0.
