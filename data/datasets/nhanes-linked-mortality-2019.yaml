id: nhanes-linked-mortality-2019
title: "NHANES public-use linked mortality files (2019 release)"
description: >-
  Vital status and cause of death to 31 December 2019 for adult NHANES
  participants 1999 to 2018, linkable to NHANES exam and lab data by SEQN.
  Anchors human axes on mortality.
