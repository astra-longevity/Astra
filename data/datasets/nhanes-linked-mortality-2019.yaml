licence:
  spdx_or_name: "NCHS data user agreement (US government work)"
  url: https://www.cdc.gov/nchs/policy/data-user-agreement.html
  redistribution_of_derived: "yes"
  citation_required: true
  notes: >-
    LA-008 (A50, 2026-10-20): approve with conditions, derived tables =
    AGGREGATE TABLES ONLY. Fetch-only: no row-level file committed, cached in
    a public artefact or published. Derived tables must be aggregates (no cell
    that singles out a person). No linkage to any other person-level data.
    Every output notes that public-use mortality files carry perturbed
    follow-up/cause for some records. Terms read by A69: Use for statistical
    analysis only; no attempt to identify people; no linkage to individually
    identifiable data. Aggregate tables look allowed; republishing row-level
    records is for Verification to decide. Some records have perturbed date or
    cause of death (vital status is not perturbed).
