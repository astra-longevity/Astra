notes: >-
  Route found by obstacle O16 (literature/obstacles/o16-slam-route.md). The
  zip was downloaded once on 2026-10-20 to check checksums, then deleted; its
  md5 matched Zenodo's. Censoring (A2): the files carry no censoring flag and
  the deposit has no README; Survival.csv has only tag, date of death and
  cause. Mice with no record cannot be told apart as alive at the cut or
  lost; their last NMR or glucose date is the only last-seen date. Causes
  such as "End of study, organs removed", "Used in experiment", "Per PI",
  "Not in room" must be treated as censored; the death/censor rule is set and
  sealed before any lifespan use. Readouts not in this deposit stay in
  slam-nia (LA-007).
