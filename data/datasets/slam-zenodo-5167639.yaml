id: slam-zenodo-5167639
title: "SLAM per-mouse data, cut 2019 (Zenodo 10.5281/zenodo.5167639, Palliyaguru 2021)"
description: >-
  Public deposit of the NIA Study of Longitudinal Aging in Mice (SLAM) released
  with Palliyaguru et al. 2021 (Cell Metab): census, survival with cause of
  death, NMR body composition, fasting glucose and lactate, body weight,
  temperature and food intake, per mouse, C57BL/6J and UM-HET3, both sexes,
  2 to 38 months. Data cut: deaths to 2019-10-08, glucose to 2019-09-03. Does
  not hold CBC, echocardiography or GTT (those stay with slam-nia).
maintainer: "National Institute on Aging, Intramural Research Program (de Cabo lab); deposited on Zenodo by the Palliyaguru 2021 authors"
