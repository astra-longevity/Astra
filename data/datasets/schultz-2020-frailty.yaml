id: schultz-2020-frailty
title: "Schultz 2020 mouse frailty data and FRIGHT/AFRAID clocks"
description: >-
  Longitudinal frailty index scores of ageing C57BL/6 mice followed to death,
  with the trained FRIGHT (frailty age) and AFRAID (life expectancy) models.
  Input for the frailty axis of metric v0 and for remaining-lifespan tests.
