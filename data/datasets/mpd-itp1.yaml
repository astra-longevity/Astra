notes: >-
  MPD RRID:SCR_003212. Licence approved with conditions as LA-006 in
  verification/approvals/licences.md: cite MPD and the project, observe meta
  robots, space requests at least 2 s, pin download date and sha256. File ids
  read from the ITP1 page on 2026-10-20. No C2008 cohort exists. Excluded: id
  750 (C2015 'with error') and id 706 (C2020, deprecated). Plain curl from the
  shared Mac got HTTP 403 (bot filter), so nothing is fetched locally and
  sizes are unknown. MPD corrects datasets over time (changelog
  https://phenome.jax.org/projects/all/changelog), so a hash change upstream
  is expected now and then. Route per MPD support email 2026-10-20 (M. Dunn,
  JAX): the phenome 403 is a phenome/study-intake bug, files served from
  studyintake.jax.org/api/files with the same file id; 403 from A9's host on
  2026-10-21, untested from Actions. Phenome URL
  (https://phenome.jax.org/getcurationfile?id=<id>&mode=download) restored
  once the bug is fixed.
