id: mpd-petkova1
title: "Aging study: peripheral blood leukocyte profiles in 32 inbred strains (MPD Petkova1)"
description: >-
  Flow cytometry of blood immune cells (B, CD4 and CD8 naive and memory subsets, NK) plus CBC of 32 inbred mouse strains, both sexes, at 6, 12, 18 and 24 months, average 7 to 8 mice per strain, sex and age. JAX Nathan Shock Center. Candidate source for the R-Sim v0 immune axis (A11).
