# Astra evidence scale: 6 levels, from weakest (1) to strongest (6).
# A claim's level = the highest level reached by the sources that SUPPORT it.
# Never round up: a mouse study stays at level 3, however good it is.
# Frozen file: changing a level means re-reading every claim.
levels:
  - level: 1
    code: in-vitro
    label: "Cells or computer"
    definition: >-
      Result obtained on cells in a dish, isolated tissue, purified molecules
      or by computer simulation. Points to a possible mechanism, nothing more
      about a whole living body.
  - level: 2
    code: invertebrate
    label: "Small model organisms"
    definition: >-
      Result obtained on a whole, short-lived organism that is far from
      humans: yeast, worm (C. elegans), fly (Drosophila), killifish. Shows
      that an effect exists in a complete living being.
  - level: 3
    code: mammal
    label: "Laboratory mammals"
    definition: >-
      Result obtained on non-human mammals: mouse, rat, dog, monkey. Closer
      to humans, but many mouse results do not hold up in people.
  - level: 4
    code: human-observational
    label: "Observations in humans"
    definition: >-
      Human data without a controlled experiment: follow-up of large
      populations (cohorts), patient-versus-healthy comparisons, human
      genetics, rare syndromes, small non-randomized trials. Shows a link in
      humans, not necessarily a cause.
  - level: 5
    code: human-trial
    label: "Randomized clinical trial"
    definition: >-
      Randomized controlled trial (RCT) in humans: a coin toss decides who
      gets the treatment and who gets a placebo, then the groups are compared.
      Includes meta-analyses of RCTs. The only kind of study that proves a
      cause in humans.
  - level: 6
    code: approved
    label: "Approved by a health authority"
    definition: >-
      Treatment or test approved by a health authority (FDA in the United
      States, EMA in Europe) for the stated use, or recommended by an
      official clinical practice guideline.
