# Intervention-class -> parameter mappings for R-Sim (T2-A2-2, T2-A10-2, T2-A50-3).
#
# One row per intervention CLASS. Written from MECHANISTIC evidence only
# (target engagement, biomarker change), never from a paper that reports
# lifespan. Sealed by Verification (A50) before the modeller sees that class's
# lifespan result. A row changed after a result is seen makes every later
# prediction using it exploratory until a new held-out item resolves.
#
# Status of every row below: SUPERSEDED, NOT USED IN CALIBRATION.
#   The rows were drafted by A68, who was not a lifespan-naive mapping writer.
#   Each is superseded by its L3 row M-00n in literature/refutation/mappings.md
#   (literature, A78). Class, parameter and term are kept only as pointers:
#   there is no prior, no effect and no source here. Any code that needs a
#   multiplier must take it from a sealed L3 row, and must fail (KeyError) if
#   it looks for `prior_multiplier` here; there is no default
#   (test_v0.py: test_mappings_superseded_no_values).
#
# Parameters use the names accepted by research/sim/v0/py/model.py:
#   hallmark.<H>  multiplier on a hallmark (spec section 2).
#   eta.<axis>, beta.<axis>, xc.<axis>, kappa, eps, c  organ/shared parameters.
#
# Term semantics (for the L3 rows): every move names the model TERM it hits:
#   production -> multiplier < 1 means less damage made
#   clearance  -> multiplier > 1 means more damage removed
#   coupling   -> multiplier < 1 means less spread between organs
# Senolytic on H8 clearance only: named assumption NA4 (v0/design/edges.md).

mappings:
  - class: mtorc1_inhibitor
    superseded_by: M-001 M-002   # L3, literature, A78; not used in calibration
    moves:
      - parameter: hallmark.H6_nutrient_sensing
        term: production
        superseded_by: M-001
      - parameter: hallmark.H5_autophagy
        term: clearance
        superseded_by: M-002

  - class: alpha_glucosidase_inhibitor
    superseded_by: M-003         # L3, literature, A78; not used in calibration
    moves:
      - parameter: hallmark.H6_nutrient_sensing
        term: production
        superseded_by: M-003

  - class: sglt2_inhibitor
    superseded_by: M-004         # L3, literature, A78; not used in calibration
    moves:
      - parameter: hallmark.H6_nutrient_sensing
        term: production
        superseded_by: M-004

  - class: senolytic
    superseded_by: M-005         # L3, literature, A78; not used in calibration
    moves:
      - parameter: hallmark.H8_senescence
        term: clearance
        superseded_by: M-005

# Classes named by A28 with no row yet (no mechanistic source opened):
#   caloric_restriction_mimetic: class definition overlaps alpha-glucosidase and
#   SGLT2 inhibitors; needs the sealed class list first.
