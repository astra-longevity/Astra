case: coloc-a
reference: verification/references/coloc/
reference_kind: hand-computed
description: Shared signal at SNP3, both traits quantitative (prior sd 0.15).

package:
  name: coloc
  version: 5.2.3
  source: CRAN

inputs:
  file: verification/references/coloc/inputs.csv
  filter: case == "A_shared"
  columns: [snp, trait, case, prior_sd, beta, se]

call: |
  d <- read.csv("verification/references/coloc/inputs.csv")
  d <- d[d$case == "A_shared", ]
  t1 <- d[d$trait == 1, ]; t2 <- d[d$trait == 2, ]
  res <- coloc::coloc.abf(
    dataset1 = list(beta = t1$beta, varbeta = t1$se^2, snp = t1$snp, type = "quant", sdY = 1),
    dataset2 = list(beta = t2$beta, varbeta = t2$se^2, snp = t2$snp, type = "quant", sdY = 1),
    p1 = 1e-4, p2 = 1e-4, p12 = 1e-5)

outputs:
  'res$summary["PP.H0.abf"]': PP.H0
  'res$summary["PP.H1.abf"]': PP.H1
  'res$summary["PP.H2.abf"]': PP.H2
  'res$summary["PP.H3.abf"]': PP.H3
  'res$summary["PP.H4.abf"]': PP.H4
  'res$results$SNP.PP.H4[res$results$snp == "SNP3"]': SNP.PP.H4.SNP3

expected:
  file: verification/references/coloc/expected.csv
  filter: case == "A_shared"

tolerance:
  PP: 1e-9          # PP.H0-H4 and SNP.PP.H4, absolute
  lABF: 1e-8        # lABF.df1, lABF.df2 if compared, absolute

notes:
  - sdY = 1 is required. Without it coloc estimates sdY from MAF and N, so the prior sd is no longer 0.15 and results differ.
  - Prior sd for type "quant" is 0.15 * sdY in coloc 5.2.3 (approx.bf.estimates).
