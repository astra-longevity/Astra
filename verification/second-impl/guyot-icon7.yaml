case: guyot-icon7
reference: verification/prep/references-survey.md (section 6)
reference_kind: printed
status: blocked   # input curve not digitised yet, see notes
description: >
  ICON7, Perren et al. 2011 (doi:10.1056/NEJMoa1103799), progression-free survival (primary
  analysis, Fig 2A), standard chemotherapy vs chemotherapy + bevacizumab. Curve 2 of 3 for D38.

package:
  name: IPDfromKM
  version: 0.1.10
  source: CRAN
  extra: [survival]

inputs:   # NOT IN THE REPO YET
  curve_std: verification/references/guyot/icon7-std-curve.csv   # columns: time (months), surv (%)
  curve_bev: verification/references/guyot/icon7-bev-curve.csv
  at_risk:   verification/references/guyot/icon7-at-risk.csv     # columns: time, nrisk_std, nrisk_bev

call: |
  library(IPDfromKM); library(survival)
  g  <- "verification/references/guyot/"
  ar <- read.csv(paste0(g, "icon7-at-risk.csv"))
  p0 <- preprocess(dat = read.csv(paste0(g, "icon7-std-curve.csv")), trisk = ar$time, nrisk = ar$nrisk_std, maxy = 100)
  p1 <- preprocess(dat = read.csv(paste0(g, "icon7-bev-curve.csv")), trisk = ar$time, nrisk = ar$nrisk_bev, maxy = 100)
  ipd <- rbind(getIPD(prep = p0, armID = 0)$IPD, getIPD(prep = p1, armID = 1)$IPD)
  write.csv(ipd, "guyot-icon7-ipd.csv", row.names = FALSE)
  km <- survfit(Surv(time, status) ~ treat, data = ipd)

outputs:
  median_std: 'summary(km)$table["treat=0", "median"]'
  median_bev: 'summary(km)$table["treat=1", "median"]'

expected:   # printed in Perren 2011
  median_std: 17.3
  median_bev: 19.0

tolerance: null   # D38

notes:
  - HR is NOT compared (A50 ruling): the authors flag non-proportional hazards, so a single HR is not meaningful. Medians only.
  - "Gap: the curves and at-risk table must be digitised from Fig 2A of the NEJM paper and committed as the three CSVs above. Only one arm's at-risk row was readable in earlier checks; both are needed."
  - "For context: ipdfc (Wei & Royston 2017) got median 17.5 for the standard arm."
  - "getIPD writes the arm to column `treat`, not `arm` (found in A62's stats-r run #256); the call uses `treat`."
